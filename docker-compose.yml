# Hayot Plus: sayt + PostgreSQL + Caddy (avtomatik HTTPS)
# Ishga tushirish: deploy/deploy.sh (.env ni o'zi yaratadi)

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: hayotplus
      POSTGRES_USER: hayotplus
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD kerak}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hayotplus -d hayotplus"]
      interval: 5s
      timeout: 3s
      retries: 20

  app:
    build: .
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://hayotplus:${POSTGRES_PASSWORD}@db:5432/hayotplus
      APP_SECRET: ${APP_SECRET:?APP_SECRET kerak}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?ADMIN_PASSWORD kerak}
    depends_on:
      db:
        condition: service_healthy

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?SITE_ADDRESS kerak}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

volumes:
  db_data:
  caddy_data:
  caddy_config:
